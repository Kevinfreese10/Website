# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Settings for Cloud Run
runConfig:
  minInstances: 1
  maxInstances: 100
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets
env:
  - variable: TELEGRAM_BOT_TOKEN
    secret: TELEGRAM_BOT_TOKEN
  - variable: TELEGRAM_CHAT_ID
    value: "7774285240"
    availability:
      - RUNTIME
  - variable: STORAGE_BUCKET
    value: studio-2604127518-57889.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PAYFAST_MERCHANT_ID
    value: "23836312"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PAYFAST_MERCHANT_KEY
    value: "h4fkhz6ouoksx"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PAYFAST_PROCESS_URL
    value: "https://www.payfast.co.za/eng/process"
    availability:
      - BUILD
      - RUNTIME
  - variable: SMTP_HOST
    value: "mail.myacc.co.za"
    availability:
      - BUILD
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - BUILD
      - RUNTIME
  - variable: SMTP_USER
    value: "no_reply@myacc.co.za"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://www.myacc.co.za"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: SMTP_PASS
    secret: SMTP_PASS
  - variable: PAYFAST_PASSPHRASE
    secret: PAYFAST_PASSPHRASE
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT

  # Cloud quote agent (owner of info@myacc.co.za). Create each secret BEFORE deploying:
  #   firebase apphosting:secrets:set INFO_MAIL_PASS
  #   firebase apphosting:secrets:set TELEGRAM_BOT_TOKEN
  #   firebase apphosting:secrets:set TELEGRAM_WEBHOOK_SECRET
  #   firebase apphosting:secrets:set CRON_SECRET
  - variable: INFO_MAIL_USER
    value: "info@myacc.co.za"
    availability:
      - RUNTIME
  - variable: INFO_MAIL_HOST
    value: "mail.myacc.co.za"
    availability:
      - RUNTIME
  - variable: INFO_MAIL_PASS
    secret: INFO_MAIL_PASS
  - variable: TELEGRAM_WEBHOOK_SECRET
    secret: TELEGRAM_WEBHOOK_SECRET
  # Also protects the existing /api/cron/* routes, which were running without it.
  - variable: CRON_SECRET
    secret: CRON_SECRET

